[project]
name = "gpu-index"
version = "0.1.0"
description = "Fetch GPU rental prices from RunPod and Vast.ai and save to Neon PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
gpu-index = "gpu_index.__main__:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpu_index*"]
